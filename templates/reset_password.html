{% extends "base.html" %}

{% block content %}
<section class="auth-page league-page">
    <div class="auth-panel">
        <p class="eyebrow">Protege tu cuenta</p>
        <p class="ui-kicker">FlagTastic · Mi cuenta</p>
            <h2>Crea una nueva contraseña</h2>
        <p>El enlace solo puede utilizarse una vez.</p>
        <form id="reset-password-form" class="auth-form">
            <label>
                Nueva contraseña
                <input name="new_password" type="password" minlength="8" autocomplete="new-password" required>
            </label>
            <label>
                Confirma la contraseña
                <input name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
            </label>
            <button type="submit">Guardar contraseña</button>
        </form>
        <p id="reset-password-message" class="form-message" role="status"></p>
        <a href="/login">Volver a iniciar sesión</a>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260928-4"></script>
<script src="/static/reset_password.js?v=20260928-1"></script>
{% endblock %}
