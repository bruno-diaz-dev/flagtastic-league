{% extends "base.html" %}

{% block content %}
<section class="referee-roster-page">
    <header class="section-header">
        <div>
            <h2>Plantilla de árbitros</h2>
            <p>Conoce al equipo arbitral activo de la liga.</p>
        </div>
    </header>

    <section id="referee-photo-panel" class="form-panel hidden">
        <h3>Completa tu perfil arbitral</h3>
        <p>Sube una foto clara para aparecer identificado en la plantilla.</p>
        <form id="referee-photo-form" class="filter-form">
            <label>
                Foto de perfil
                <input name="file" type="file" accept="image/jpeg,image/png,image/webp" required>
            </label>
            <button type="submit">Guardar foto</button>
        </form>
        <p id="referee-photo-message" class="form-message" role="status"></p>
    </section>

    <p id="referee-roster-message" class="form-message" role="status"></p>
    <section id="referee-roster" class="referee-roster-grid" aria-live="polite"></section>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260928-1"></script>
<script src="/static/referees.js?v=20260928-1"></script>
{% endblock %}
