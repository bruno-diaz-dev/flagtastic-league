{% extends "base.html" %}

{% block content %}
<section class="admin-users-page league-page">
    <header class="section-header">
        <div>
            <div id="page-hero-tags" class="hero-tags"></div>
            <h2>Usuarios y roles</h2>
            <p>Otorga únicamente el acceso necesario para las funciones de cada persona.</p>
            <ul id="page-hero-stats" class="hero-stats" hidden></ul>
        </div>
    </header>
    <section class="form-panel">
        <details class="ui-disclosure"><summary>Crear cuenta de personal<span class="ui-disclosure-hint">Opciones</span></summary><div class="ui-disclosure-body">
        <form id="staff-account-form" class="staff-account-form">
            <label>Nombre completo<input name="name" required></label>
            <label>Correo<input name="email" type="email" required></label>
            <label>Contraseña inicial<input name="password" type="password" minlength="8" required></label>
            <fieldset>
                <legend>Roles</legend>
                <label class="role-choice"><input type="checkbox" name="staff_roles" value="league_admin"> Administrador de liga</label>
                <label class="role-choice"><input type="checkbox" name="staff_roles" value="referee"> Árbitro</label>
                <label class="role-choice"><input type="checkbox" name="staff_roles" value="team_representative"> Representante</label>
            </fieldset>
            <button type="submit">Crear cuenta</button>
        </form>
        <p id="staff-account-message" class="form-message" role="status"></p>
    
        </div></details>
    </section>
    <section class="filters-panel filter-bar admin-users-filters" aria-label="Filtros de usuarios">
        <label class="filter-search">
            Buscar por nombre
            <input
                id="admin-user-name-filter"
                type="search"
                placeholder="Nombre, AKA o nombre legal"
                autocomplete="off"
            >
        </label>
        <p id="admin-users-count" class="results-count" aria-live="polite"></p>
    </section>
    <div id="admin-users-message" class="form-message" role="status"></div>
    <div id="admin-users-body" class="user-list" aria-live="polite"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20261010-1"></script>
<script src="/static/admin_users.js?v=20261128-5"></script>
{% endblock %}
