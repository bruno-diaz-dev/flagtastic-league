{% extends "base.html" %}

{% block content %}
<section class="admin-users-page">
    <header class="section-header">
        <h2>Usuarios y roles</h2>
        <p>Otorga únicamente el acceso necesario para las funciones de cada persona.</p>
    </header>
    <section class="form-panel">
        <h3>Crear cuenta de personal</h3>
        <form id="staff-account-form" class="staff-account-form">
            <label>Nombre completo<input name="name" required></label>
            <label>Correo<input name="email" type="email" required></label>
            <label>Contraseña inicial<input name="password" type="password" minlength="8" required></label>
            <fieldset>
                <legend>Roles</legend>
                <label class="role-choice"><input type="checkbox" name="staff_roles" value="league_admin"> Administrador de liga</label>
                <label class="role-choice"><input type="checkbox" name="staff_roles" value="referee"> Árbitro</label>
                <label class="role-choice"><input type="checkbox" name="staff_roles" value="team_representative"> Representante</label>
            </fieldset>
            <button type="submit">Crear cuenta</button>
        </form>
        <p id="staff-account-message" class="form-message" role="status"></p>
    </section>
    <div id="admin-users-message" class="form-message" role="status"></div>
    <div class="users-table-wrapper">
        <table class="users-table">
            <thead><tr><th>Persona</th><th>Correo</th><th>Roles</th><th>Estado</th><th>Acción</th></tr></thead>
            <tbody id="admin-users-body"></tbody>
        </table>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260925-4"></script>
<script src="/static/admin_users.js?v=20260925-4"></script>
{% endblock %}
