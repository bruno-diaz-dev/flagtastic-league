{% extends "base.html" %}

{% block content %}
<section>
    <header class="section-header">
        <div>
            <h2>Equipos</h2>
            <p>Registra y consulta los equipos activos de la liga</p>
        </div>
    </header>

    <section class="form-panel team-manager-only">
        <h3>Registrar equipo</h3>

        <form id="team-form" class="team-form">
            <label>
                Nombre del equipo
                <input
                    type="text"
                    name="name"
                    autocomplete="off"
                    required
                >    
            </label>

            <label>
                Rama
                <select name="branch" required>
                    <option value="">Selecciona una rama</option>
                    <option value="varonil">Varonil</option>
                    <option value="femenil">Femenil</option>
                    <option value="mixto">Mixto</option>
                </select>
            </label>

            <label>
                Categoria
                <select name="category" required>
                    <option value="u6">U6</option>
                    <option value="u8">U8</option>
                    <option value="u10">U10</option>
                    <option value="u12">U12</option>
                    <option value="u14">U14</option>
                    <option value="u16">U16</option>
                    <option value="u18">U18</option>
                    <option value="libre">Libre</option>
                </select>
            </label>

            <label>
                Logo del equipo
                <input
                    type="file"
                    name="logo"
                    accept="image/jpeg,image/png,image/webp"
                    required
                >
            </label>

            <label>Head Coach<input type="text" name="head_coach" maxlength="120"></label>
            <label>Coach<input type="text" name="coach" maxlength="120"></label>
            <label>Manager<input type="text" name="manager" maxlength="120"></label>

            <button type="submit">Registrar Equipo</button>
        </form>

        <p id="form-message" class="form-message" role="status"></p>
    </section>

    <section class="filters-panel">
        <label>
            Rama
            <select id="team-filter-branch">
                <option value="">Todas las ramas</option>
                <option value="varonil">Varonil</option>
                <option value="femenil">Femenil</option>
                <option value="mixto">Mixto</option>
            </select>
        </label>

        <label>
            Categoria
            <select id="team-filter-category">
                <option value="">Todas las categorías</option>
                <option value="u6">U6</option>
                <option value="u8">U8</option>
                <option value="u10">U10</option>
                <option value="u12">U12</option>
                <option value="u14">U14</option>
                <option value="u16">U16</option>
                <option value="u18">U18</option>
                <option value="libre">Libre</option>
            </select>
        </label>
    </section>

    <section id="teams" class="teams-grid" aria-live="polite"></section>
</section>

{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260926-2"></script>
<script src="/static/teams.js?v=20260926-3"></script>
{% endblock %}
