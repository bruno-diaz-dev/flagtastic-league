{% extends "base.html" %}

{% block content %}
<section>
    <header class="section-header">
        <div>
            <h2>Tabla</h2>
            <p>Consulta la tabla de posiciones de cada división.</p>
        </div>
    </header>

    <section class="form-panel">
        <h3>Consultar tabla</h3>

        <form id="standings-form" class="standings-form">
            <label id="standings-branch-field">
                Rama
                <select id="standings-branch" name="branch" required>
                    <option value="">Selecciona una rama</option>
                    <option value="varonil">Varonil</option>
                    <option value="femenil">Femenil</option>
                    <option value="mixto">Mixto</option>
                </select>
            </label>

            <label id="standings-youth-branch" class="hidden">
                Rama
                <span class="readonly-control">Infantiles</span>
            </label>

            <label>
                Categoria
                <select id="standings-category" name="category" required>
                    <option value="">Selecciona una categoria</option>
                    <option value="u6">U6</option>
                    <option value="u8">U8</option>
                    <option value="u10">U10</option>
                    <option value="u12">U12</option>
                    <option value="u14">U14</option>
                    <option value="u16">U16</option>
                    <option value="u18">U18</option>
                    <option value="libre">Libre</option>
                </select>
            </label>

            <button type="submit">Consultar tabla</button>
        </form>

        <p id="youth-standings-rule" class="form-hint hidden">
            U8, U10 y U12 usan una sola tabla con equipos de todas las ramas.
        </p>

        <p id="standings-form-message" class="form-message" role="status"></p>
    </section>

    <section id="standings" class="standings-table" aria-live="polite"></section>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20261001-2"></script>
<script src="/static/standings.js?v=20261001-2"></script>
{% endblock %}
