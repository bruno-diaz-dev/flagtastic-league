{% extends "base.html" %}

{% block content %}
<section class="dashboard-page league-page">
    <header class="section-header">
        <div class="player-profile-header">
            <img id="dashboard-photo" class="profile-photo hidden" alt="Foto de perfil">
            <span id="dashboard-photo-placeholder" class="profile-photo profile-placeholder hidden" aria-hidden="true"></span>
            <div>
                <p class="ui-kicker">FlagTastic · Mi temporada</p>
            <h2 id="dashboard-player-name">Mi dashboard</h2>
                <p id="dashboard-greeting">Tu temporada en un solo lugar.</p>
            </div>
        </div>
    </header>

    <section class="form-panel">
        <details class="ui-disclosure"><summary>Mi perfil público<span class="ui-disclosure-hint">Opciones</span></summary><div class="ui-disclosure-body">
        <form id="profile-form" class="dashboard-join-form">
            <label>AKA<input name="aka" type="text" maxlength="80" placeholder="Tu apodo en la liga"></label>
            <button type="submit">Guardar AKA</button>
        </form>
        <p id="profile-message" class="form-message" role="status"></p>
    
        </div></details>
    </section>

    <section class="form-panel">
        <details class="ui-disclosure"><summary>Registrarme en un equipo<span class="ui-disclosure-hint">Opciones</span></summary><div class="ui-disclosure-body">
        <form id="join-team-form" class="dashboard-join-form">
            <label id="join-team-branch-field">Rama
                <select id="join-team-branch">
                    <option value="">Todas las ramas</option>
                </select>
            </label>
            <label id="join-team-youth-branch" class="hidden">Rama
                <span class="readonly-control">Infantiles</span>
            </label>
            <label>Categoría
                <select id="join-team-category">
                    <option value="">Todas las categorías</option>
                </select>
            </label>
            <label>Equipo<select name="team_id" required></select></label>
            <label>Número<input name="jersey_number" type="number" min="0" required></label>
            <button type="submit">Unirme al equipo</button>
        </form>
        <p id="join-team-results" class="results-count" aria-live="polite"></p>
        <p id="join-team-message" class="form-message" role="status"></p>
    
        </div></details>
    </section>

    <section aria-labelledby="personal-stats-title">
        <h3 id="personal-stats-title">Mis estadísticas</h3>
        <div id="personal-stats" class="stat-grid" aria-live="polite"></div>
    </section>

    <section aria-labelledby="my-teams-title">
        <h3 id="my-teams-title">Mis equipos</h3>
        <div id="dashboard-teams" class="dashboard-teams" aria-live="polite"></div>
    </section>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20261001-2"></script>
<script src="/static/dashboard.js?v=20261001-1"></script>
{% endblock %}
