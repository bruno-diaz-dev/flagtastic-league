<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flagtastic League</title>
    <link rel="stylesheet" href="/static/style.css?v=20260926-4">
</head>
<body class="sidebar-collapsed">
    <div class="layout">
        <aside class="sidebar">
            <button
                id="sidebar-toggle"
                class="sidebar-toggle"
                type="button"
                aria-label="Expandir menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="brand">
                <img
                    class="brand-logo"
                    src="/static/assets/flagtastic.jpeg"
                    alt="Flagtastic Football League"
                >
                <p class="eyebrow">Flagtastic Football League</p>
                <h1>Operaciones</h1>
            </div>

            <nav class="navigation" aria-label="Navegación principal">
                <a class="nav-link" href="/teams">
                    <span class="nav-text">Equipos</span>
                    <span class="nav-short">EQ</span>
                </a>

                <a class="nav-link" href="/games">
                    <span class="nav-text">Partidos</span>
                    <span class="nav-short">PA</span>
                </a>

                <a class="nav-link" href="/standings">
                    <span class="nav-text">Tabla</span>
                    <span class="nav-short">TB</span>
                </a>

                <a class="nav-link" href="/statistics">
                    <span class="nav-text">Estadísticas</span>
                    <span class="nav-short">ES</span>
                </a>

                <a id="dashboard-link" class="nav-link hidden" href="/dashboard">
                    <span class="nav-text">Mi dashboard</span>
                    <span class="nav-short">MI</span>
                </a>

                <a id="representative-dashboard-link" class="nav-link hidden" href="/representative-dashboard">
                    <span class="nav-text">Mi equipo</span>
                    <span class="nav-short">ME</span>
                </a>

                <a id="admin-users-link" class="nav-link hidden" href="/admin/users">
                    <span class="nav-text">Usuarios</span>
                    <span class="nav-short">US</span>
                </a>

                <a id="referee-games-link" class="nav-link hidden" href="/referee/games">
                    <span class="nav-text">Mis partidos</span>
                    <span class="nav-short">AR</span>
                </a>
            </nav>

            <div class="session-controls">
                <span id="session-user" class="session-user"></span>
                <a id="login-link" class="nav-link" href="/login">
                    <span class="nav-text">Iniciar sesión</span>
                    <span class="nav-short">IN</span>
                </a>
                <button id="logout-button" class="logout-button hidden" type="button">
                    Cerrar sesión
                </button>
            </div>
        </aside>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <button
        id="sidebar-backdrop"
        class="sidebar-backdrop"
        type="button"
        aria-label="Cerrar menu"
        tabindex="-1"
    ></button>

    <script src="/static/layout.js?v=20260926-2"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
