{% extends "base.html" %}

{% block content %}
<section>
    <header class="section-header">
        <div>
            <h2>Partidos</h2>
            <p>Consulta los partidos registrados y sus marcadores</p>
        </div>
    </header>

    <section class="form-panel admin-only">
        <h3>Registrar partido</h3>

        <form id="game-form" class="game-form">
            <label>
                Equipo local
                <select name="home_team_id" required></select>
            </label>

            <label>
                Equipo visitante
                <select name="away_team_id" required></select>
            </label>

            <label>
                Jornada
                <input name="week" type="number" min="1" value="1" required>
            </label>

            <button type="submit">Registrar partido</button>
        </form>

        <p id="game-form-message" class="form-message" role="status"></p>
    </section>

    <section class="filters-panel games-filters" aria-label="Filtros de partidos">
        <label>
            Jornada
            <select id="game-filter-week">
                <option value="">Todas las jornadas</option>
            </select>
        </label>

        <label>
            Rama
            <select id="game-filter-branch">
                <option value="">Todas las ramas</option>
                <option value="varonil">Varonil</option>
                <option value="femenil">Femenil</option>
                <option value="mixto">Mixto</option>
            </select>
        </label>

        <label>
            Categoría
            <select id="game-filter-category">
                <option value="">Todas las categorías</option>
                <option value="u6">U6</option>
                <option value="u8">U8</option>
                <option value="u10">U10</option>
                <option value="u12">U12</option>
                <option value="u14">U14</option>
                <option value="u16">U16</option>
                <option value="u18">U18</option>
                <option value="libre">Libre</option>
            </select>
        </label>
    </section>

    <p id="games-count" class="results-count" aria-live="polite"></p>
    <section id="games" class="games-list" aria-live="polite"></section>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260925-2"></script>
<script src="/static/games.js?v=20260925-2"></script>
{% endblock %}
