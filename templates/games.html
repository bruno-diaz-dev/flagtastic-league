{% extends "base.html" %}

{% block content %}
<section>
    <header class="section-header">
        <div>
            <h2>Partidos</h2>
            <p>Consulta los partidos registrados y sus marcadores</p>
        </div>
    </header>

    <section class="form-panel admin-only">
        <h3>Registrar partido</h3>

        <form id="game-form" class="game-form">
            <label>
                Equipo local
                <select name="home_team_id" required></select>
            </label>

            <label>
                Equipo visitante
                <select name="away_team_id" required></select>
            </label>

            <label>
                Jornada
                <input name="week" type="number" min="1" value="1" required>
            </label>

            <label>
                Campo
                <select name="field_number" required>
                    {% for field_number in range(1, 9) %}
                    <option value="{{ field_number }}">Campo {{ field_number }}</option>
                    {% endfor %}
                </select>
            </label>

            <label>
                Hora
                <input name="start_time" type="time">
            </label>

            <button type="submit">Registrar partido</button>
        </form>

        <p id="game-form-message" class="form-message" role="status"></p>
    </section>

    <section class="form-panel admin-only">
        <h3>Asignar oficial</h3>
        <form id="referee-assignment-form" class="filter-form">
            <label>
                Partido
                <select name="game_id" required></select>
            </label>
            <label>
                Persona
                <select name="referee_id" required></select>
            </label>
            <label>
                Puesto
                <select name="position" required>
                    <option value="referee">Referee</option>
                    <option value="down_judge">Down Judge</option>
                    <option value="field_judge">Field Judge</option>
                    <option value="side_judge">Side Judge</option>
                    <option value="statistician">Estadístico</option>
                </select>
            </label>
            <button type="submit">Asignar oficial</button>
        </form>
        <p id="referee-assignment-message" class="form-message" role="status"></p>
        <div id="assigned-referees" class="assigned-referees"></div>
    </section>

    <section class="filters-panel games-filters" aria-label="Filtros de partidos">
        <label>
            Jornada
            <select id="game-filter-week">
                <option value="">Todas las jornadas</option>
            </select>
        </label>

        <label>
            Rama
            <select id="game-filter-branch">
                <option value="">Todas las ramas</option>
                <option value="varonil">Varonil</option>
                <option value="femenil">Femenil</option>
                <option value="mixto">Mixto</option>
            </select>
        </label>

        <label>
            Categoría
            <select id="game-filter-category">
                <option value="">Todas las categorías</option>
                <option value="u6">U6</option>
                <option value="u8">U8</option>
                <option value="u10">U10</option>
                <option value="u12">U12</option>
                <option value="u14">U14</option>
                <option value="u16">U16</option>
                <option value="u18">U18</option>
                <option value="libre">Libre</option>
            </select>
        </label>

        <label>
            Campo
            <select id="game-filter-field">
                <option value="">Todos los campos</option>
                {% for field_number in range(1, 9) %}
                <option value="{{ field_number }}">Campo {{ field_number }}</option>
                {% endfor %}
            </select>
        </label>
    </section>

    <p id="games-count" class="results-count" aria-live="polite"></p>
    <section id="games" class="games-list" aria-live="polite"></section>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260925-6"></script>
<script src="/static/games.js?v=20260925-6"></script>
{% endblock %}
