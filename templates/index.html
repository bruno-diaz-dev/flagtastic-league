<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flagtastic League</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Flagtastic Football League</p>
                <h1>Operaciones de Liga</h1>
            </div>
        </header>

        <section class="section-header">
            <div>
                <h2>Equipos</h2>
                <p>Registra equipos y consulta los equipos activos de la liga.</p>
            </div>
        </section>

        <section class="form-panel">
            <h3>Registrar equipo</h3>

            <form id="team-form" class="team-form">
                <label>
                    Nombre del equipo
                    <input
                        type="text"
                        name="name"
                        autocomplete="off"
                        required
                    >
                </label>

                <label>
                    Rama
                    <input
                        type="text"
                        name="branch"
                        autocomplete="off"
                        required
                    >
                </label>

                <label>
                    Categoría
                    <input
                        type="text"
                        name="category"
                        autocomplete="off"
                        required
                    >
                </label>

                <button type="submit">Registrar equipo</button>
            </form>

            <p id="form-message" class="form-message" role="status"></p>
        </section>

        <section id="teams" class="teams-grid" aria-live="polite"></section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
