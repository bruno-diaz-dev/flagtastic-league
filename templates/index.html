<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flagtastic League</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <button
                id="sidebar-toggle"
                class="sidebar-toggle"
                type="button"
                aria-label="Contraer menu"
                aria-expanded="true"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="brand">
                <img
                    class="brand-logo"
                    src="/static/assets/flagtastic.jpeg"
                    alt="Flagtastic Football League"
                >
                <p class="eyebrow">Flagtastic Football League</p>
                <h1>Operaciones</h1>
            </div>

            <nav class="navigation" aria-label="Navegación principal">
                <button class="nav-link active" type="button" data-view="teams">
                    <span class="nav-text">Equipos</span>
                    <span class="nav-short">EQ</span>
                </button>
                <button class="nav-link" type="button" data-view="games">
                    <span class="nav-text">Partidos</span>
                    <span class="nav-short">PA</span>
                </button>
                <button class="nav-link" type="button" data-view="standings">
                    <span class="nav-text">Tabla</span>
                    <span class="nav-short">TB</span>
                </button>
            </nav>
        </aside>

        <main class="content">

                <section class="filters-panel">
                    <label>
                        Rama
                        <select id="team-filter-branch">
                            <option value="">Todas las ramas</option>
                            <option value="varonil">Varonil</option>
                            <option value="femenil">Femenil</option>
                            <option value="mixto">Mixto</option>
                        </select>
                    </label>
                
                    <label>
                        Categoría
                        <select id="team-filter-category">
                            <option value="">Todas las categorías</option>
                            <option value="u6">U6</option>
                            <option value="u8">U8</option>
                            <option value="u12">U12</option>
                            <option value="u14">U14</option>
                            <option value="u16">U16</option>
                            <option value="u18">U18</option>
                            <option value="libre">Libre</option>
                        </select>
                    </label>
                </section>

                <section id="teams" class="teams-grid" aria-live="polite"></section>

                <section id="roster-panel" class="roster-panel hidden" aria-live="polite">
                    <div class="section-header">
                        <div>
                            <h2 id="roster-title">Roster</h2>
                            <p id="roster-subtitle">Jugadores registrados en el equipo.</p>
                        </div>
                    </div>

                    <section class="form-panel">
                        <h3>Registrar jugador</h3>

                        <form id="player-form" class="player-form">
                            <label>
                                Nombre
                                <input
                                    type="text"
                                    name="name"
                                    autocomplete="off"
                                    required
                                >
                            </label>

                            <label>
                                CURP
                                <input
                                    type="text"
                                    name="curp"
                                    autocomplete="off"
                                    maxlength="18"
                                    required
                                >
                            </label>

                            <label>
                                Edad
                                <input
                                    type="number"
                                    name="age"
                                    min="1"
                                    required
                                >
                            </label>

                            <label>
                                Numero
                                <input
                                    type="number"
                                    name="jersey_number"
                                    min="0"
                                    required
                                >
                            </label>

                            <button type="submit">Registrar jugado</button>
                        </form>

                        <p id="player-form-message" class="form-message" role="status"></p>
                    </section>

                    <div id="roster" class="roster-list"></div>
                </section>
            </section>

            <section id="games-view" class="view">
                <header class="section-header">
                    <div>
                        <h2>Partidos</h2>
                        <p>Consulta los partidos registrados y sus marcadores.</p>
                    </div>
                </header>

                <section class="form-panel">
                    <h3>Registrar partidos</h3>

                    <form id="game-form" class="game-form">
                        <label>
                            Equipo local
                            <select name="home_team_id" required></select>
                        </label>

                        <label>
                            Equipo visitante
                            <select name="away_team_id" required></select>
                        </label>

                        <button type="submit">Registrar partido</button>
                    </form>

                    <p id="game-form-message" class="form-message" role="status"></p>
                </section>

                <section id="games" class="games-list" aria-live="polite"></section>
            </section>
            
            <section id="standings-view" class="view">
                <header class="section-header">
                    <div>
                        <h2>Tabla</h2>
                        <p>Consulta la tabla de posiciones por rama y categoria</p>
                    </div>
                </header>

                <section class="form-panel">
                    <h3>Consultar tabla</h3>

                    <form id="standings-form" class="standings-form">
                        <label>
                            Rama
                            <select name="branch" required>
                                <option value="">Selecciona una rama</option>
                                <option value="varonil">Varonil</option>
                                <option value="femenil">Femenil</option>
                                <option value="mixto">Mixto</option>
                            </select>
                        </label>

                        <label>
                            Categoria
                            <select name="category" required>
                                <option value="u6">U6</option>
                                <option value="u8">U8</option>
                                <option value="u10">U10</option>
                                <option value="u12">U12</option>
                                <option value="u14">U14</option>
                                <option value="u16">U16</option>
                                <option value="u18">U18</option>
                                <option value="libre">Libre</option>
                            </select>
                        </label>
                        
                        <button type="submit">Consultar tabla</button>
                    </form>

                    <p id="standings-form-message" class="form-message" role="status"></p>
                </section>

                <section id="standings" class="standings-table" aria-live="polite"></section>
            </section>
        </main>
    </div>
    
    <script src="/static/api.js"></script>
    <script src="/static/teams.js"></script>
    <script src="/static/games.js"></script>
    <script src="/static/standings.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
