<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flagtastic League</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <p class="eyebrow">Flagtastic Football League</p>
                <h1>Operaciones</h1>
            </div>

            <nav class="navigation" aria-label="Navegación principal">
                <button class="nav-link active" type="button" data-view="teams">
                    Equipos
                </button>
                <button class="nav-link" type="button" data-view="games">
                    Partidos
                </button>
            </nav>
        </aside>

        <main class="content">
            <section id="teams-view" class="view active-view">
                <header class="section-header">
                    <div>
                        <h2>Equipos</h2>
                        <p>Registra equipos y consulta los equipos activos de la liga.</p>
                    </div>
                </header>

                <section class="form-panel">
                    <h3>Registrar equipo</h3>

                    <form id="team-form" class="team-form">
                        <label>
                            Nombre del equipo
                            <input
                                type="text"
                                name="name"
                                autocomplete="off"
                                required
                            >
                        </label>

                        <label>
                            Rama
                            <input
                                type="text"
                                name="branch"
                                autocomplete="off"
                                required
                            >
                        </label>

                        <label>
                            Categoría
                            <input
                                type="text"
                                name="category"
                                autocomplete="off"
                                required
                            >
                        </label>

                        <button type="submit">Registrar equipo</button>
                    </form>

                    <p id="form-message" class="form-message" role="status"></p>
                </section>

                <section id="teams" class="teams-grid" aria-live="polite"></section>

                <section id="roster-panel" class="roster-panel hidden" aria-live="polite">
                    <div class="section-header">
                        <div>
                            <h2 id="roster-title">Roster</h2>
                            <p id="roster-subtitle">Jugadores registrados en el equipo.</p>
                        </div>
                    </div>

                    <div id="roster" class="roster-list"></div>
                </section>
            </section>

            <section id="games-view" class="view">
                <header class="section-header">
                    <div>
                        <h2>Partidos</h2>
                        <p>Consulta los partidos registrados y sus marcadores.</p>
                    </div>
                </header>

                <section id="games" class="games-list" aria-live="polite"></section>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
