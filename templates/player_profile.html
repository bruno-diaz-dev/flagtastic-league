{% extends "base.html" %}

{% block content %}
<section id="public-player-profile" class="dashboard-page league-page" data-player-id="{{ player_id }}">
    <button id="public-profile-back" class="back-link link-button" type="button">← Volver</button>

    <header class="section-header">
        <div class="player-profile-header">
            <span id="public-player-photo-placeholder" class="profile-photo profile-placeholder" aria-hidden="true"></span>
            <img id="public-player-photo" class="profile-photo hidden" alt="">
            <div>
                <p class="ui-kicker">FlagTastic · Perfil de jugador</p>
            <h2 id="public-player-name">Perfil de jugador</h2>
                <p id="public-player-identity">Cargando temporada...</p>
            </div>
        </div>
    </header>

    <section aria-labelledby="public-player-stats-title">
        <h3 id="public-player-stats-title">Estadísticas de temporada</h3>
        <label>Categoría y equipo<select id="public-player-stats-team" aria-label="Categoría y equipo de las estadísticas"></select></label>
        <p id="public-player-stats-context" class="form-help" aria-live="polite"></p>
        <div id="public-player-stats" class="stat-grid" aria-live="polite"></div>
    </section>

    <section aria-labelledby="public-player-teams-title">
        <h3 id="public-player-teams-title">Equipos</h3>
        <div id="public-player-teams" class="dashboard-teams" aria-live="polite"></div>
    </section>

    <p id="public-player-message" class="form-message" role="status"></p>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20261020-1"></script>
<script src="/static/player_statistics_scope.js?v=20261020-1"></script>
<script src="/static/player_profile.js?v=20261020-1"></script>
{% endblock %}
