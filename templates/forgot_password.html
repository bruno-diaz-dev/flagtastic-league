{% extends "base.html" %}

{% block content %}
<section class="auth-page">
    <div class="auth-panel">
        <p class="eyebrow">Recupera tu acceso</p>
        <h2>Restablecer contraseña</h2>
        <p>Escribe el correo asociado a tu cuenta.</p>
        <form id="forgot-password-form" class="auth-form">
            <label>
                Correo electrónico
                <input name="email" type="email" autocomplete="email" required>
            </label>
            <button type="submit">Enviar enlace</button>
        </form>
        <p id="forgot-password-message" class="form-message" role="status"></p>
        <a href="/login">Volver a iniciar sesión</a>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260928-4"></script>
<script src="/static/forgot_password.js?v=20260928-1"></script>
{% endblock %}
