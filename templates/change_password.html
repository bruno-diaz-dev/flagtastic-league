{% extends "base.html" %}

{% block content %}
<section class="auth-page">
    <div class="auth-panel">
        <p class="eyebrow">Protege tu cuenta</p>
        <h2>Cambia tu contraseña</h2>
        <p>Debes reemplazar la contraseña inicial antes de continuar.</p>
        <form id="change-password-form" class="auth-form">
            <label>Contraseña actual<input name="current_password" type="password" autocomplete="current-password" required></label>
            <label>Nueva contraseña<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label>
            <label>Confirma la nueva contraseña<input name="confirmation" type="password" minlength="8" autocomplete="new-password" required></label>
            <button type="submit">Guardar contraseña</button>
        </form>
        <p id="change-password-message" class="form-message" role="status"></p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/api.js?v=20260925-5"></script>
<script src="/static/change_password.js?v=20260925-1"></script>
{% endblock %}
